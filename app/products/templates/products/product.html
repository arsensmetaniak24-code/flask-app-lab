{% extends 'base.html' %}

{% block content %}
<div class="container my-5 text-light">
    <div class="mb-4">
        <a href="{{ url_for('products.all_products') }}" class="btn btn-outline-secondary">
            &larr; Назад до списку
        </a>
    </div>

    <div class="card bg-secondary text-white border-secondary shadow-lg">
        <div class="card-header bg-dark text-warning border-secondary d-flex justify-content-between align-items-center">
            <span class="fs-6 text-uppercase tracking-wide">Продукт #{{ product.id }}</span>
            <span class="badge bg-warning text-dark fs-6">${{ product.price }}</span>
        </div>

        <div class="card-body p-4">
            <h2 class="card-title fw-bold mb-3 display-6">{{ product.name }}</h2>
            <hr class="border-secondary my-3">

            <h5 class="text-secondary-emphasis mb-2">Опис:</h5>
            <p class="card-text fs-5 text-light opacity-90 leading-relaxed">
                {{ product.content }}
            </p>
        </div>

        <div class="card-footer bg-dark border-secondary d-flex justify-content-between align-items-center">
            <small class="text-muted">Ціна: <strong class="text-warning">${{ product.price }}</strong></small>
            <button class="btn btn-dark border-secondary px-4">Додати в кошик</button>
        </div>
    </div>
</div>
{% endblock %}
