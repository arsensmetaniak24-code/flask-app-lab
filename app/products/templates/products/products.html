{% extends 'base.html' %}

{% block content %}
<div class="container my-4 text-light">
    <h2 class="mb-4 text-center text-secondary-emphasis">All Products</h2>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for product in products %}
        <div class="col">
            <div class="card h-100 bg-secondary text-white border-secondary shadow-sm">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title fw-bold">{{ product.name }}</h5>
                    <h6 class="card-subtitle mb-2 text-warning">${{ product.price }}</h6>
                    <p class="card-text text-light opacity-75 flex-grow-1">
                        {{ product.content }}
                    </p>
                    <div class="mt-3">
                        <a href="{{ url_for('products.product_detail', product_id=product.id) }}"
                           class="btn btn-dark w-100 border-secondary">
                            Детальніше
                        </a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
