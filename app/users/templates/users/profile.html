{% extends 'base.html' %}

{% block content %}
<section id="profile" class="py-2">
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-primary text-white py-3">
            <h2 class="mb-0 fw-light">Welcome, {{ username }}!</h2>
        </div>
        <div class="card-body p-4 bg-body-tertiary">
            <p class="text-muted mb-0">Here you can view your information and log out.</p>
            <form class="mt-3" action="{{ url_for('users.logout') }}" method="post">
                <button type="submit" class="btn btn-danger">Log Out</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
