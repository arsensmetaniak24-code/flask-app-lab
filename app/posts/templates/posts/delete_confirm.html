{% extends 'base.html' %}

{% block css %}
    <link rel="stylesheet" href="{{ url_for('posts.static', filename='css/posts.css') }}">
{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-sm border-top border-4 border-danger">
                <div class="card-body p-4 text-center">
                    <i class="bi bi-exclamation-triangle text-danger d-block mb-2" style="font-size: 3rem;"></i>

                    <h1 class="h4 fw-bold mb-3">Delete this post?</h1>

                    <p class="mb-1">You are about to delete:</p>
                    <p class="fs-5 fw-semibold mb-3">&laquo;{{ post.title }}&raquo;</p>
                    <p class="text-body-secondary small mb-4">This action cannot be undone.</p>

                    <form method="POST" action="{{ url_for('posts.delete_post', post_id=post.id) }}"
                          class="d-flex justify-content-center gap-2">
                        {{ form.hidden_tag() }}
                        <a href="{{ url_for('posts.detail_post', post_id=post.id) }}"
                           class="btn btn-outline-secondary px-4">
                            Cancel
                        </a>
                        <button type="submit" class="btn btn-danger px-4 d-inline-flex align-items-center gap-2">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
